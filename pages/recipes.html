<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#2563eb">

    <title>Mes recettes | Hana Fit</title>


    <link
        rel="stylesheet"
        href="../assets/css/components.css"
    >

    <link
        rel="stylesheet"
        href="../assets/css/recipes.css"
    >


    <style>
        /* Navigation fixe + retour en haut */
        body {
            padding-bottom: 110px;
        }

        .bottom-nav {
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            width: min(calc(100% - 22px), 760px);
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            padding: 10px;
            border: 1px solid rgba(255,255,255,.96);
            border-radius: 26px;
            background: rgba(255,255,255,.96);
            box-shadow: 0 20px 50px rgba(15,23,42,.18);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .bottom-nav a {
            padding: 7px 3px;
            color: #64748b;
            text-align: center;
            text-decoration: none;
            font-size: 11px;
            font-weight: 750;
        }

        .bottom-nav a span {
            display: block;
            margin-bottom: 4px;
            font-size: 20px;
        }

        .bottom-nav a.active {
            color: #2563eb;
        }

        .scroll-top-button {
            position: fixed;
            z-index: 1100;
            right: max(16px, env(safe-area-inset-right));
            bottom: calc(104px + env(safe-area-inset-bottom));
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            padding: 0;
            border: 1px solid #bfdbfe;
            border-radius: 50%;
            background: rgba(255,255,255,.98);
            color: #2563eb;
            box-shadow: 0 12px 30px rgba(15,23,42,.22);
            font: inherit;
            font-size: 25px;
            font-weight: 900;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(10px);
            transition: opacity .2s ease, visibility .2s ease, transform .2s ease;
        }

        .scroll-top-button.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0);
        }

        @media (max-width: 560px) {
            .bottom-nav a {
                font-size: 9px;
            }

            .bottom-nav a span {
                font-size: 18px;
            }

            .scroll-top-button {
                right: 14px;
                bottom: calc(100px + env(safe-area-inset-bottom));
                width: 46px;
                height: 46px;
                font-size: 23px;
            }
        }
    </style>

</head>


<body>


    <main class="page">


        <!-- RETOUR VERS NUTRITION -->

        <a
            href="./nutrition-v4.html"
            class="back-link"
        >
            ← Retour
        </a>



        <!-- EN-TÊTE -->

        <header class="recipes-header">

            <div class="header-icon">
                🍽️
            </div>


            <div>

                <span class="badge">
                    HANA FIT
                </span>

                <h1 class="section-title">
                    Mes recettes
                </h1>

                <p class="section-subtitle">
                    Retrouve toutes tes idées de repas et leurs valeurs nutritionnelles.
                </p>

            </div>

        </header>



        <!-- RECHERCHE -->

        <section class="recipe-tools card">

            <div class="recipe-search">

                <span>
                    🔎
                </span>

                <input
                    type="search"
                    id="recipe-search"
                    placeholder="Rechercher une recette..."
                    autocomplete="off"
                >

            </div>



            <div
                id="recipe-filters"
                class="recipe-filters"
            >

                <button
                    type="button"
                    class="recipe-filter active"
                    data-filter="all"
                >
                    Toutes
                </button>


                <button
                    type="button"
                    class="recipe-filter"
                    data-filter="Petit-déjeuner"
                >
                    🥣 Petit-déjeuner
                </button>


                <button
                    type="button"
                    class="recipe-filter"
                    data-filter="Déjeuner"
                >
                    🥗 Déjeuner
                </button>


                <button
                    type="button"
                    class="recipe-filter"
                    data-filter="Collation"
                >
                    🍎 Collation
                </button>


                <button
                    type="button"
                    class="recipe-filter"
                    data-filter="Dîner"
                >
                    🍝 Dîner
                </button>


                <button
                    type="button"
                    class="recipe-filter"
                    data-filter="favorites"
                >
                    ⭐ Favoris
                </button>

            </div>

        </section>



        <!-- RÉSUMÉ -->

        <section class="recipes-summary">

            <div>

                <h2>
                    Bibliothèque
                </h2>

                <p id="recipes-count">
                    Chargement des recettes...
                </p>

            </div>

        </section>



        <!-- RECETTES -->

        <section
            id="recipes-container"
            class="recipes-grid"
        >

            <div class="loading-card card">

                <div class="loading-spinner">
                </div>

                <p>
                    Chargement de tes recettes...
                </p>

            </div>

        </section>


    </main>


    <nav class="bottom-nav" aria-label="Navigation principale">
        <a href="../index.html">
            <span>⌂</span>
            Accueil
        </a>

        <a href="./nutrition-v4.html" class="active">
            <span>●</span>
            Nutrition
        </a>

        <a href="./training.html">
            <span>H</span>
            Training
        </a>

        <a href="./wellbeing.html">
            <span>🌿</span>
            Bien-être
        </a>

        <a href="./progress.html">
            <span>⌁</span>
            Progression
        </a>
    </nav>

    <button
        type="button"
        class="scroll-top-button"
        aria-label="Revenir en haut de la page"
        title="Revenir en haut"
    >
        ↑
    </button>




    <!-- JAVASCRIPT -->

    <script src="../assets/js/store.js"></script>

    <script src="../assets/js/database.js"></script>

    <script src="../assets/js/recipes.js"></script>



    <script>
        (() => {
            const button = document.querySelector(".scroll-top-button");
            if (!button) return;

            const updateScrollButton = () => {
                button.classList.toggle("visible", window.scrollY > 300);
            };

            button.addEventListener("click", () => {
                window.scrollTo({ top: 0, behavior: "smooth" });
            });

            window.addEventListener("scroll", updateScrollButton, { passive: true });
            window.addEventListener("load", updateScrollButton);
            updateScrollButton();
        })();
    </script>

</body>

</html>
