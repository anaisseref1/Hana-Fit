<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hana Fit — Rowing assis</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172b4d;display:grid;place-items:center;min-height:100vh}
.card{width:min(720px,94vw);background:#fff;border:1px solid #dfe6ef;border-radius:24px;padding:18px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.tag{background:#e8f1ff;color:#286bd3;padding:7px 11px;border-radius:999px;font-weight:750;font-size:13px}.sub{color:#71809a;font-size:14px}
.stage{background:linear-gradient(#fafbfd,#edf2f7);border-radius:20px;overflow:hidden}svg{width:100%;display:block}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:13px;background:#2f73df;color:#fff;padding:11px 16px;font-weight:750;font-size:15px;cursor:pointer}.status{font-size:14px;color:#71809a}
.note{margin-top:12px;border:1px solid #e0e7f0;border-radius:14px;padding:11px 13px;font-size:14px}
</style><style>body{min-height:0!important;background:transparent!important;display:block!important}.card{width:100%!important;max-width:none!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:transparent!important}.head,.controls,.note{display:none!important}.stage{border-radius:18px!important}</style></head><body>
<main class="card"><div class="head"><div><b style="font-size:24px">Rowing assis</b><div class="sub">Démo vectorielle Hana Fit · Hana V3</div></div><span class="tag">MUSCULATION</span></div>
<div class="stage"><svg id="scene" viewBox="0 0 680 400" role="img" aria-label="Hana réalise Rowing assis"></svg></div>
<div class="controls"><button id="toggle">⏸ Pause</button><span class="status">bras tendus → tirage vers le buste → retour</span></div><div class="note">🔑 <b>Point clé :</b> poitrine stable, épaules basses et coudes tirés vers l’arrière.</div></main>
<script>
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("scene");
function el(tag,a,p=svg){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(a||{}))e.setAttribute(k,v);p.appendChild(e);return e}
const skin="#efb08d",hair="#392a29",hanaTop="#2f73df",leggings="#596f91",ink="#29394c",metal="#46586d";
function line(a,b,w,c,p){return el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:c,"stroke-width":w,"stroke-linecap":"round"},p)}
function circle(p,r,c,g){return el("circle",{cx:p[0],cy:p[1],r,fill:c},g)}
function mix(a,b,t){return a+(b-a)*t} function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
el("ellipse",{cx:340,cy:350,rx:260,ry:13,fill:"#dbe3ec"});
const gear=el("g",{}),bodyG=el("g",{}),limbs=el("g",{});
function hana(p){
 limbs.innerHTML="";bodyG.innerHTML="";
 line(p.shoulder,p.hip,46,hanaTop,bodyG);circle(p.head,30,skin,bodyG);
 el("path",{d:`M${p.head[0]-28} ${p.head[1]-3}q2-37 34-34q27 4 25 33q-13-18-29-16q-18 3-30 16`,fill:hair},bodyG);
 el("path",{d:`M${p.head[0]-20} ${p.head[1]-7}q-18 27-7 61q5 16 18 25q-7-22-3-44z`,fill:hair},bodyG);
 line(p.shoulder,p.elbowL,15,skin,limbs);line(p.elbowL,p.handL,15,skin,limbs);circle(p.handL,8,skin,limbs);
 line(p.shoulder,p.elbowR,15,skin,limbs);line(p.elbowR,p.handR,15,skin,limbs);circle(p.handR,8,skin,limbs);
 line(p.hip,p.kneeL,28,leggings,limbs);line(p.kneeL,p.footL,26,leggings,limbs);line(p.footL,[p.footL[0]+27,p.footL[1]],15,"#fff",limbs);
 line(p.hip,p.kneeR,28,leggings,limbs);line(p.kneeR,p.footR,26,leggings,limbs);line(p.footR,[p.footR[0]+27,p.footR[1]],15,"#fff",limbs);
}
let running=true,start=performance.now(),frozen=0;
function cyc(t){return(1-Math.cos(t*Math.PI*2))/2}
function frame(now){if(running)draw(((now-start)%4000)/4000);requestAnimationFrame(frame)}
document.getElementById("toggle").addEventListener("click",()=>{if(running){frozen=performance.now();running=false;document.getElementById("toggle").textContent="▶ Reprendre"}else{start+=performance.now()-frozen;running=true;document.getElementById("toggle").textContent="⏸ Pause"}});
requestAnimationFrame(frame);
gear.innerHTML=`<rect x="95" y="285" width="120" height="25" rx="7" fill="#71839a"/><rect x="110" y="310" width="18" height="35" fill="#46586d"/><rect x="185" y="310" width="18" height="35" fill="#46586d"/><rect x="525" y="105" width="45" height="230" rx="8" fill="#46586d"/><circle cx="530" cy="210" r="13" fill="#222f3f"/><line id="cable" x1="530" y1="210" x2="380" y2="230" stroke="#222f3f" stroke-width="4"/>`;function draw(t){let q=cyc(t),handx=mix(410,335,q),elx=mix(440,370,q);hana({head:[270,155],shoulder:[285,195],hip:[285,270],elbowL:[elx,220],handL:[handx,230],elbowR:[elx,245],handR:[handx,240],kneeL:[380,290],footL:[455,325],kneeR:[390,295],footR:[465,330]});document.getElementById("cable").setAttribute("x2",handx);document.getElementById("cable").setAttribute("y2",235)}</script></body></html>
