<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hana Fit — Leg curl</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172b4d;display:grid;place-items:center;min-height:100vh}.card{width:min(720px,94vw);background:#fff;border:1px solid #dfe6ef;border-radius:24px;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.tag{background:#e8f1ff;color:#286bd3;padding:7px 11px;border-radius:999px;font-weight:750;font-size:13px}.sub{color:#71809a;font-size:14px}.stage{background:linear-gradient(#fafbfd,#edf2f7);border-radius:20px;overflow:hidden}svg{width:100%;display:block}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:13px;background:#2f73df;color:white;padding:11px 16px;font-weight:750;font-size:15px}.status{font-size:14px;color:#71809a}.note{margin-top:12px;border:1px solid #e0e7f0;border-radius:14px;padding:11px 13px;font-size:14px}</style><style>body{min-height:0!important;background:transparent!important;display:block!important}.card{width:100%!important;max-width:none!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:transparent!important}.head,.controls,.note{display:none!important}.stage{border-radius:18px!important}</style></head><body><main class="card"><div class="head"><div><b style="font-size:24px">Leg curl</b><div class="sub">Démo vectorielle Hana Fit · Hana V3</div></div><span class="tag">MUSCULATION</span></div><div class="stage"><svg id="scene" viewBox="0 0 680 400"></svg></div><div class="controls"><button id="toggle">⏸ Pause</button><span class="status">jambes presque tendues → flexion → retour contrôlé</span></div><div class="note">🔑 <b>Point clé :</b> garder les hanches en appui et fléchir les genoux sans élan.</div></main><script>
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("scene");

function circle(p,r,c,g){return el("circle",{cx:p[0],cy:p[1],r,fill:c},g)}
function mix(a,b,t){return a+(b-a)*t} function cyc(t){return(1-Math.cos(t*Math.PI*2))/2}

function hana(p){limbs.innerHTML="";bodyG.innerHTML="";line(p.shoulder,p.hip,46,hanaTop,bodyG);circle(p.head,30,skin,bodyG);el("path",{d:`M${p.head[0]-28} ${p.head[1]-3}q2-37 34-34q27 4 25 33q-13-18-29-16q-18 3-30 16`,fill:hair},bodyG);el("path",{d:`M${p.head[0]-20} ${p.head[1]-7}q-18 27-7 61q5 16 18 25q-7-22-3-44z`,fill:hair},bodyG);line(p.shoulder,p.elbowL,15,skin,limbs);line(p.elbowL,p.handL,15,skin,limbs);circle(p.handL,8,skin,limbs);line(p.shoulder,p.elbowR,15,skin,limbs);line(p.elbowR,p.handR,15,skin,limbs);circle(p.handR,8,skin,limbs);line(p.hip,p.kneeL,28,leggings,limbs);line(p.kneeL,p.footL,26,leggings,limbs);line(p.footL,[p.footL[0]+27,p.footL[1]],15,"#fff",limbs);line(p.hip,p.kneeR,28,leggings,limbs);line(p.kneeR,p.footR,26,leggings,limbs);line(p.footR,[p.footR[0]+27,p.footR[1]],15,"#fff",limbs)}
let running=true,start=performance.now(),frozen=0;function frame(now){if(running)draw(((now-start)%4000)/4000);requestAnimationFrame(frame)}document.getElementById("toggle").addEventListener("click",()=>{if(running){frozen=performance.now();running=false;document.getElementById("toggle").textContent="▶ Reprendre"}else{start+=performance.now()-frozen;running=true;document.getElementById("toggle").textContent="⏸ Pause"}});requestAnimationFrame(frame);
